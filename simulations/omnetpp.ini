[General]
network = rpm_lora_research.src.topology.DirectRPMNetwork
sim-time-limit = 50s
**.vector-recording = true
**.scalar-recording = true

# LoRa radio medium
**.LoRaNic.energySourceModule = "^.radio.IdealEpEnergyStorage"
**.radio.radioMediumModule = "loRaMedium"
**.radio.separateTransmissionParts = false
**.radio.separateReceptionParts = false

# Patient and doctor parameters
**.patient.patientId = 1
**.patient.doctorId = 1
**.patient.samplingInterval = 5s

**.doctor.doctorId = 1


# Force all nodes into the same wireless medium.
**.patient.mobility.initialX = 100m
**.patient.mobility.initialY = 100m
**.doctor.mobility.initialX = 150m
**.doctor.mobility.initialY = 100m

**.loRaMedium.mediumLimitCache.maxTransmissionDuration = 1s

[Config DistributedRPM]
network = rpm_lora_research.src.topology.DistributedRPMNetwork
sim-time-limit = 120s
result-dir = "results/multi-patient-validation-20261108-0250-r13-queue-drain"

**.numPatients = 20
**.numRelays = 3
**.doctorId = 1
**.maxHopCount = 4
**.samplingInterval = 30s
**.centerFrequency = 868MHz
**.bandwidth = 125kHz
**.spreadingFactor = 7
**.codeRate = 4
**.txPower = 14dBm

**.radio.radioMediumModule = "loRaMedium"
**.radio.separateTransmissionParts = false
**.radio.separateReceptionParts = false
**.loRaMedium.mediumLimitCache.maxTransmissionDuration = 1s
**.scalar-recording = true
**.vector-recording = true
